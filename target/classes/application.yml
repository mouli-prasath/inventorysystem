server:
  port: 8080

spring:
  application:
    name: inventory-backend

  datasource:
    url: jdbc:mysql://localhost:3306/electronic_store_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B59}
    access-token-expiration-ms: 28800000   # 8 hours (default for staff)
    refresh-token-expiration-ms: 2592000000 # 30 days
  cors:
    allowed-origins: http://localhost:8081

logging:
  level:
    com.electronicstore.inventory: DEBUG
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
